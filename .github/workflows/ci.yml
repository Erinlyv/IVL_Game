name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 纯静态前端、零运行时依赖：CI 仅在 Node 下跑自测脚本。
# _uitest / _kotest / _gftest 依赖 jsdom（仅测试期），由 package-lock 固定版本。
# 注：_strategyplay.js 是本地攻略实测实验（jsdom 全生涯驱动、无平衡断言、约 2.5 min/生涯），
#     不纳入 CI 门禁；崩溃回归已由 _uitest 覆盖。需要时本地手动跑：node _strategyplay.js [N]。
permissions:
  contents: read

jobs:
  test:
    name: 自测脚本（冒烟 / UI / KO/后悔药 / 冠亚决赛）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装测试依赖
        run: npm ci

      - name: JS 语法检查
        run: npm run check

      - name: 冒烟测试（engine 自动重跑生涯）
        run: npm run test:smoke

      - name: UI 冒烟（jsdom 跑通完整生涯编排）
        run: npm run test:ui

      - name: KO 模块专项（季后赛 / 深渊晋级图 / 后悔药）
        run: npm run test:ko

      - name: 冠亚决赛弹窗定向冲烟（7 定位 · jsdom）
        run: npm run test:gf
